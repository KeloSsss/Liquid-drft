<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid & Pody L8 - Sklep / Sprzedaż</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #050b18;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 162, 255, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 20% 90%, rgba(0, 243, 255, 0.08) 0%, transparent 50%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Nagłówek firmy */
        .header {
            background: rgba(13, 25, 54, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 162, 255, 0.3);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .logo-title {
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(45deg, #00f3ff, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #72a1e5;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Siatka produktów */
        .products-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .product-card {
            background: rgba(13, 25, 54, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 162, 255, 0.2);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s, border-color 0.2s;
        }

        .product-card:hover {
            border-color: #00f3ff;
            transform: translateY(-2px);
        }

        .product-img-box {
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            padding: 5px;
        }

        .product-img-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-info {
            flex-grow: 1;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .product-desc {
            font-size: 0.8rem;
            color: #8ab4f8;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 1.15rem;
            font-weight: 800;
            color: #00f3ff;
        }

        .negotiable {
            font-size: 0.75rem;
            color: #ff007f;
            background: rgba(255, 0, 127, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            font-weight: 600;
            display: inline-block;
        }

        /* Sekcja kontaktu */
        .contact-box {
            background: rgba(13, 25, 54, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 162, 255, 0.3);
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .contact-label {
            font-size: 0.85rem;
            color: #72a1e5;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .call-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #0051ff, #00f3ff);
            color: #050b18;
            font-size: 1.4rem;
            font-weight: 900;
            text-decoration: none;
            padding: 16px;
            border-radius: 50px;
            width: 100%;
            box-shadow: 0 5px 20px rgba(0, 243, 255, 0.4);
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .call-button:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 243, 255, 0.7);
        }

        .phone-icon {
            width: 24px;
            height: 24px;
            fill: #050b18;
        }

        /* Animowany napis na dole */
        .footer-text {
            font-size: 1.1rem;
            font-weight: 800;
            background: linear-gradient(45deg, #ff007f, #00f3ff, #ff007f);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textNeon 4s linear infinite;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        @keyframes textNeon {
            to { background-position: 200% center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Nagłówek -->
        <div class="header">
            <div class="logo-title">Liquid & Vapes Store</div>
            <div class="subtitle">Oferta Specjalna</div>
        </div>

        <!-- Lista produktów -->
        <div class="products-section">
            <!-- Produkt 1: Liquid -->
            <div class="product-card">
                <div class="product-img-box">
                    <img src="liquid.png" alt="Liquid">
                </div>
                <div class="product-info">
                    <div class="product-name">Liquidy</div>
                    <div class="product-desc">Różne smaki i moce do wyboru</div>
                    <div class="product-price">Zapytaj o cenę</div>
                </div>
            </div>

            <!-- Produkt 2: Pody L8 -->
            <div class="product-card">
                <div class="product-img-box">
                    <img src="l8.png" alt="Pod L8">
                </div>
                <div class="product-info">
                    <div class="product-name">Pody L8 (Vape)</div>
                    <div class="product-desc">Wydajne urządzenie system pod</div>
                    <div>
                        <span class="product-price">20 zł</span>
                        <span class="negotiable">Do negocjacji</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sekcja Kontaktowa -->
        <div class="contact-box">
            <div class="contact-label">Szybki kontakt telefoniczny</div>
            <a href="tel:728565481" class="call-button">
                <svg class="phone-icon" viewBox="0 0 24 24">
                    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
                728 565 481
            </a>
            <div class="footer-text">
                Kontakt po Liquid<br>Więcej na PV
            </div>
        </div>
    </div>

</body>
</html>
