<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIQUID & VAPE // PREMIUM STORE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #02040a;
            --card-bg: rgba(10, 16, 32, 0.85);
            --primary-cyan: #00f3ff;
            --primary-blue: #0066ff;
            --accent-pink: #ff0055;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 243, 255, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            overflow-x: hidden;
            position: relative;
        }

        .bg-grid {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(to right, rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 35px 35px;
            z-index: -2;
        }

        .bg-glow {
            position: fixed;
            top: -10%; left: 50%;
            transform: translateX(-50%);
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.18) 0%, transparent 70%);
            filter: blur(80px);
            z-index: -1;
        }

        .main-wrapper {
            max-width: 440px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 1;
        }

        /* Status Bar */
        .status-bar {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-glow);
            border-radius: 50px;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .status-online {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #00ff87;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #00ff87;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff87;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .status-tag {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        /* Nagłówek */
        .header-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 22px;
            padding: 25px 18px;
            text-align: center;
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .header-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-cyan), var(--accent-pink), transparent);
        }

        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.7rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, var(--primary-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }

        .main-subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Produkty */
        .product-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            gap: 14px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            position: relative;
        }

        .product-card:hover {
            border-color: var(--primary-cyan);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 243, 255, 0.2);
        }

        .product-image-frame {
            width: 85px;
            height: 85px;
            background: #080d1a;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            padding: 6px;
            overflow: hidden;
        }

        .product-image-frame img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
        }

        .product-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .product-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .price-tag {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .current-price {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--primary-cyan);
        }

        .neg-badge {
            font-size: 0.7rem;
            color: var(--accent-pink);
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid rgba(255, 0, 85, 0.4);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Sekcja Kontaktowa */
        .contact-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 22px;
            padding: 22px 18px;
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .call-main-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-cyan));
            color: #02040a;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.35rem;
            font-weight: 900;
            text-decoration: none;
            padding: 16px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 243, 255, 0.4);
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }

        .call-main-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 30px rgba(0, 243, 255, 0.7);
        }

        .action-buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .sub-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
        }

        .sub-btn:hover {
            border-color: var(--primary-cyan);
            color: var(--primary-cyan);
        }

        .liquify-banner {
            background: linear-gradient(90deg, rgba(255, 0, 85, 0.12), rgba(0, 243, 255, 0.12));
            border: 1px dashed rgba(0, 243, 255, 0.4);
            border-radius: 12px;
            padding: 12px;
        }

        .liquify-banner-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--accent-pink), var(--primary-cyan), #00ff87);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textFlow 3s linear infinite;
            text-transform: uppercase;
        }

        @keyframes textFlow {
            to { background-position: 200% center; }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--primary-cyan);
            color: #02040a;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0, 243, 255, 0.5);
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="main-wrapper">

        <!-- Status -->
        <div class="status-bar">
            <div class="status-online">
                <div class="dot"></div>
                <span>OFERTA AKTYWNA</span>
            </div>
            <div class="status-tag">WIĘCEJ NA PV</div>
        </div>

        <!-- Nagłówek -->
        <div class="header-card">
            <h1 class="main-title">LIQUID & VAPE STORE</h1>
            <p class="main-subtitle">Dostępna Oferta</p>
        </div>

        <!-- Produkty -->
        <div class="product-grid">

            <!-- Karta 1: Liquid -->
            <div class="product-card">
                <div class="product-image-frame">
                    <!-- Automatyczne sprawdzanie kilku nazw plików -->
                    <img id="liquid-img" src="liquid.png.JPG" 
                         onerror="this.onerror=null; this.src='liquid.png.jpg'; if(this.src.includes('jpg')) this.onerror=function(){this.onerror=null; this.src='liquid.png'; if(this.src.includes('png')) this.onerror=function(){this.onerror=null; this.src='liquid.jpg';}};" 
                         alt="Liquidy">
                </div>
                <div class="product-info">
                    <h2 class="product-title">Liquidy</h2>
                    <p class="product-desc">Różne smaki i moce</p>
                    <div class="price-tag">
                        <span class="current-price">Zapytaj o cenę</span>
                    </div>
                </div>
            </div>

            <!-- Karta 2: Pod L8 -->
            <div class="product-card">
                <div class="product-image-frame">
                    <img id="l8-img" src="l8.png.JPG" 
                         onerror="this.onerror=null; this.src='l8.png.jpg'; if(this.src.includes('jpg')) this.onerror=function(){this.onerror=null; this.src='l8.png'; if(this.src.includes('png')) this.onerror=function(){this.onerror=null; this.src='l8.jpg';}};" 
                         alt="Pod L8 Vape">
                </div>
                <div class="product-info">
                    <h2 class="product-title">Pody L8 (Vape)</h2>
                    <p class="product-desc">Urządzenie pod vape</p>
                    <div class="price-tag">
                        <span class="current-price">20 zł</span>
                        <span class="neg-badge">DO NEGOCJACJI</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Kontakt -->
        <div class="contact-card">
            <a href="tel:728565481" class="call-main-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
                728 565 481
            </a>

            <div class="action-buttons-grid">
                <a href="sms:728565481" class="sub-btn">
                    💬 Wyślij SMS
                </a>
                <button class="sub-btn" onclick="copyPhone()">
                    📋 Kopiuj Numer
                </button>
            </div>

            <div class="liquify-banner">
                <div class="liquify-banner-text">
                    KONTAKT PO LIQUID<br>WIĘCEJ INFORMACJI NA PV
                </div>
            </div>
        </div>

    </div>

    <div id="toast" class="toast">Skopiowano numer!</div>

    <script>
        function copyPhone() {
            navigator.clipboard.writeText('728565481');
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
