<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIQUID & VAPE // PREMIUM STORE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #02040a;
            --card-bg: rgba(10, 16, 32, 0.85);
            --primary-cyan: #00f3ff;
            --primary-blue: #0066ff;
            --accent-pink: #ff0055;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 243, 255, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            overflow-x: hidden;
            position: relative;
        }

        .bg-grid {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(to right, rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 35px 35px;
            z-index: -2;
        }

        .bg-glow {
            position: fixed;
            top: -10%; left: 50%;
            transform: translateX(-50%);
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.18) 0%, transparent 70%);
            filter: blur(80px);
            z-index: -1;
        }

        .main-wrapper {
            max-width: 440px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 1;
        }

        /* Status Bar */
        .status-bar {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-glow);
            border-radius: 50px;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .status-online {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #00ff87;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #00ff87;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff87;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .status-tag {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        /* Nagłówek */
        .header-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 22px;
            padding: 25px 18px;
            text-align: center
